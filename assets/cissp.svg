<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="gv" gradientUnits="userSpaceOnUse" x1="18" y1="14" x2="18" y2="98">
      <stop offset="0" stop-color="#a3cfc3"/>
      <stop offset="1" stop-color="#1f7a4d"/>
    </linearGradient>
    <linearGradient id="gh" gradientUnits="userSpaceOnUse" x1="18" y1="98" x2="104" y2="98">
      <stop offset="0" stop-color="#1f7a4d"/>
      <stop offset="0.72" stop-color="#7fbfae"/>
      <stop offset="1" stop-color="#a3cfc3"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- 白底圆角卡 -->
  <rect x="4" y="4" width="112" height="112" rx="14" fill="#ffffff" filter="url(#sh)"/>
  <!-- 方括号「[」：左竖 + 底横 + 右端下弯钩 -->
  <path d="M18 14 L18 98 L94 98 Q104 98 104 86" stroke="url(#gv)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- CISSP. 主字 -->
  <text x="64" y="62" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#1a1a1a">CISSP.</text>
  <!-- 右上 ISC2 圆章 -->
  <g transform="translate(97,22)">
    <circle cx="0" cy="0" r="14" fill="#111111"/>
    <text x="0" y="3.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="bold" fill="#ffffff">ISC2</text>
  </g>
</svg>
